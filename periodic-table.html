<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Интерактивная периодическая таблица — Ресурсный центр «Химия»</title>
<style>
  :root {
    --bg: #f8fafc; --card: #fff; --text: #1e293b; --muted: #64748b;
    --border: #e2e8f0; --accent: #2563eb;
    --c-nonmetal: #6ee7b7; --c-noble: #c4b5fd; --c-alkali: #fca5a5;
    --c-alkaline: #fdba74; --c-metalloid: #86efac; --c-halogen: #67e8f9;
    --c-post: #d1d5db; --c-transition: #fde68a; --c-lanthanide: #fbcfe8;
    --c-actinide: #e9d5ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
  }
  header {
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 1rem 2rem; position: sticky; top: 0; z-index: 100;
    box-shadow: 0 1px 3px rgba(0,0,0,.05);
  }
  header nav {
    display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap;
    max-width: 1400px; margin: 0 auto;
  }
  header nav a {
    color: var(--text); text-decoration: none; font-weight: 500;
    padding: .25rem .5rem; border-radius: 6px; transition: background .2s;
  }
  header nav a:hover { background: var(--border); }
  header nav a.active { background: var(--accent); color: #fff; }
  main { max-width: 1400px; margin: 0 auto; padding: 2rem; }
  h1 { font-size: 1.75rem; margin: 0 0 .5rem; }
  .subtitle { color: var(--muted); margin: 0 0 1.5rem; }
  .controls { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; align-items: center; }
  .search-box { flex: 1; min-width: 250px; }
  .search-box input {
    width: 100%; padding: .75rem 1rem; border: 2px solid var(--border);
    border-radius: 10px; font-size: 1rem; outline: none; transition: border-color .2s;
    background: var(--card); color: var(--text);
  }
  .search-box input:focus { border-color: var(--accent); }
  .filter-buttons { display: flex; gap: .5rem; flex-wrap: wrap; }
  .filter-btn {
    padding: .45rem .9rem; border: 2px solid var(--border); background: var(--card);
    border-radius: 8px; cursor: pointer; font-size: .85rem; font-weight: 500;
    transition: all .2s; color: var(--text);
  }
  .filter-btn:hover { border-color: var(--accent); }
  .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .table-wrapper {
    overflow-x: auto; background: var(--card); border-radius: 12px;
    padding: 1.5rem; box-shadow: 0 1px 3px rgba(0,0,0,.05); margin-bottom: 1.5rem;
  }
  .periodic-table {
    display: grid;
    grid-template-columns: repeat(18, minmax(56px, 1fr));
    grid-template-rows: repeat(10, auto);
    gap: 4px; min-width: 1080px;
  }
  .element {
    aspect-ratio: 1; border-radius: 6px; padding: 4px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: all .15s; border: 2px solid transparent; position: relative;
    user-select: none; overflow: hidden;
  }
  .element:hover { transform: scale(1.08); z-index: 10; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
  .element.selected { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,.3); }
  .element.dimmed { opacity: .18; }
  .element .num {
    font-size: .6rem; position: absolute; top: 2px; left: 4px;
    color: rgba(0,0,0,.55); font-variant-numeric: tabular-nums;
  }
  .element .sym { font-size: 1.1rem; font-weight: 700; line-height: 1; }
  .element .name {
    font-size: .55rem; text-align: center; line-height: 1.1; margin-top: 2px;
    color: rgba(0,0,0,.75); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; max-width: 100%;
  }
  .element .mass { font-size: .5rem; color: rgba(0,0,0,.5); font-variant-numeric: tabular-nums; }
  .cat-nonmetal { background: var(--c-nonmetal); }
  .cat-noble { background: var(--c-noble); }
  .cat-alkali { background: var(--c-alkali); }
  .cat-alkaline { background: var(--c-alkaline); }
  .cat-metalloid { background: var(--c-metalloid); }
  .cat-halogen { background: var(--c-halogen); }
  .cat-post { background: var(--c-post); }
  .cat-transition { background: var(--c-transition); }
  .cat-lanthanide { background: var(--c-lanthanide); }
  .cat-actinide { background: var(--c-actinide); }
  .fblock-label {
    display: flex; align-items: center; justify-content: center; font-size: .7rem;
    font-weight: 600; color: var(--muted); background: var(--bg); border-radius: 6px;
    padding: 4px; text-align: center; line-height: 1.1;
  }
  .placeholder {
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); border: 2px dashed var(--border); border-radius: 6px;
    font-size: .65rem; color: var(--muted); font-weight: 600; aspect-ratio: 1;
  }
  .detail-panel {
    background: var(--card); border-radius: 12px; padding: 1.5rem;
    box-shadow: 0 1px 3px rgba(0,0,0,.05); display: none;
  }
  .detail-panel.visible { display: block; }
  .detail-header { display: flex; align-items: center; gap: 1.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .detail-symbol {
    width: 96px; height: 96px; border-radius: 12px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0;
  }
  .detail-symbol .sym { font-size: 2.4rem; line-height: 1; }
  .detail-symbol .num { font-size: .85rem; opacity: .65; font-variant-numeric: tabular-nums; }
  .detail-title h2 { margin: 0 0 .25rem; font-size: 1.5rem; }
  .detail-title .cat-label { font-size: .9rem; color: var(--muted); }
  .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; }
  .detail-item { background: var(--bg); padding: .75rem 1rem; border-radius: 8px; }
  .detail-item .label {
    font-size: .72rem; color: var(--muted); text-transform: uppercase;
    letter-spacing: .05em; margin-bottom: .25rem;
  }
  .detail-item .value { font-size: 1rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .legend {
    background: var(--card); border-radius: 12px; padding: 1rem 1.5rem;
    box-shadow: 0 1px 3px rgba(0,0,0,.05); display: flex; gap: 1rem;
    flex-wrap: wrap; font-size: .82rem;
  }
  .legend-item { display: flex; align-items: center; gap: .5rem; }
  .legend-swatch { width: 18px; height: 18px; border-radius: 4px; }
  footer { text-align: center; padding: 2rem; color: var(--muted); font-size: .875rem; }
  @media (max-width: 768px) {
    main { padding: 1rem; }
    .periodic-table { min-width: 900px; }
    .element .name { display: none; }
    .element .sym { font-size: .9rem; }
  }
</style>

  if (num >= 57 && num <= 71) return { row: 9, col: 3 + (num - 57) };
  if (num >= 89 && num <= 103) return { row: 10, col: 3 + (num - 89) };
  return { row: period, col: group };
}

lb2.className = 'fblock-label';
lb2.style.gridRow = 10; lb2.style.gridColumn = '1 / span 2';
lb2.textContent = 'Актиноиды';
table.appendChild(lb2);

// Build element cells
const cells = {};
ELEMENTS.forEach(el => {
  const [num, sym, name, mass, cat, group, period, config] = el;
  const { row, col } = gridPos(num, group, period);
  const div = document.createElement('div');
  div.className = `element cat-${cat}`;
  div.style.gridRow = row;
  div.style.gridColumn = col;
  div.dataset.num = num;
  div.dataset.sym = sym.toLowerCase();
  div.dataset.name = name.toLowerCase();
  div.dataset.cat = cat;
  div.innerHTML = `<span class="num">${num}</span><span class="sym">${sym}</span><span class="name">${name}</span>`;
  div.addEventListener('click', () => showDetail(num));
  table.appendChild(div);
  cells[num] = div;
});

// Legend
const legend = document.getElementById('legend');
Object.entries(CAT_LABELS).forEach(([cat, label]) => {
  const item = document.createElement('div');
  item.className = 'legend-item';
  item.innerHTML = `<span class="legend-swatch cat-${cat}"></span>${label}`;
  legend.appendChild(item);
});

// Filters
let activeCat = null;
Object.entries(CAT_LABELS).forEach(([cat, label]) => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn';
  btn.dataset.cat = cat;
  btn.textContent = label;
  btn.addEventListener('click', () => {
    if (activeCat === cat) { activeCat = null; }
    else { activeCat = cat; }
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === activeCat));
    applyFilters();
  });
  filtersBox.appendChild(btn);
});

// Search
searchInput.addEventListener('input', applyFilters);

function applyFilters() {
  const q = searchInput.value.trim().toLowerCase();
  ELEMENTS.forEach(el => {
    const [num, sym, name, , cat] = el;
    const matchesQ = !q || sym.toLowerCase().includes(q) || name.toLowerCase().includes(q) || String(num) === q;
    const matchesCat = !activeCat || cat === activeCat;
    cells[num].classList.toggle('dimmed', !(matchesQ && matchesCat));
  });
}

// Detail panel
function showDetail(num) {
  const el = ELEMENTS.find(e => e[0] === num);
  if (!el) return;
  const [n, sym, name, mass, cat, group, period, config] = el;
  const groupDisplay = (cat === 'lanthanide' || cat === 'actinide')
    ? `${cat === 'lanthanide' ? 'f-блок (лантаноид)' : 'f-блок (актиноид)'}`
    : String(group);
  detail.innerHTML = `
    <div class="detail-header">
      <div class="detail-symbol cat-${cat}">
        <span class="sym">${sym}</span>
        <span class="num">${n}</span>
      </div>
      <div class="detail-title">
        <h2>${name}</h2>
        <div class="cat-label">${CAT_LABELS[cat]}</div>
      </div>
    </div>
    <div class="detail-grid">
      <div class="detail-item"><div class="label">Атомный номер</div><div class="value">${n}</div></div>
      <div class="detail-item"><div class="label">Атомная масса</div><div class="value">${mass} а.е.м.</div></div>
      <div class="detail-item"><div class="label">Период</div><div class="value">${period}</div></div>
      <div class="detail-item"><div class="label">Группа</div><div class="value">${groupDisplay}</div></div>
      <div class="detail-item" style="grid-column: 1 / -1;"><div class="label">Электронная конфигурация</div><div class="value">${config}</div></div>
    </div>`;
  detail.classList.add('visible');
  Object.values(cells).forEach(c => c.classList.remove('selected'));
  cells[num].classList.add('selected');
  detail.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
</script>
</body>
</html>
